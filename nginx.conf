server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Runtime config is regenerated on every container start, so never cache it.
    location = /env-config.js {
        add_header Cache-Control "no-store";
        try_files $uri =404;
    }

    # Hashed build assets are immutable and safe to cache aggressively.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA fallback: unknown paths render the app, which handles routing.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic hardening for a static site.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
