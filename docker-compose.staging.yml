name: franklin-s-gym-rebuild-the-masters-then-see-staging

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: franklin-s-gym-rebuild-the-masters-then-see-staging-web
    expose:
      - "80"
    environment:
      # All optional. The app runs cleanly when they are empty.
      UMAMI_URL: "${UMAMI_URL:-}"
      UMAMI_WEBSITE_ID: "${UMAMI_WEBSITE_ID:-}"
      SENTRY_DSN: "${SENTRY_DSN:-}"
      # Demo seed flag. This release implements no demo behavior; it must only
      # start cleanly whether the flag is set or not.
      SEED_DEMO: "${SEED_DEMO:-1}"
    networks:
      - default
      - staging
    mem_limit: 512m
    oom_score_adj: 800
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  staging:
    external: true
    name: factory-staging-net
